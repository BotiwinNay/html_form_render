<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form
    action="https://teach-backend-fawn.vercel.app/api/product"
    method="POST"
    enctype="multipart/form-data"
  >
    <fieldset>
      <legend>General Info</legend>

      <div class="row">
        <label for="itemName">Item Name</label>
        <input id="itemName" name="itemName" type="text">
      </div>

      <div class="row">
        <label for="description">Description</label>
        <textarea id="description" name="description"></textarea>
      </div>

      <div class="row">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="" selected></option>
          <option value="stationery">stationery</option>
          <option value="electronics">electronics</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Misc.</legend>

      <div class="row">
        <label for="inventoryAmount">Inventory Amount</label>
        <input id="inventoryAmount" name="inventoryAmount" type="number">
      </div>

      <div class="row">
        <label for="listPrice">List price</label>
        <input id="listPrice" name="listPrice" type="number" step="0.01">
      </div>

      <div class="row">
        <span>Available Stores</span>
        <div class="options">
          <label><input type="checkbox" name="availableStores" value="Bangkok">Bangkok</label>
          <label><input type="checkbox" name="availableStores" value="Pattaya">Pattaya</label>
          <label><input type="checkbox" name="availableStores" value="Phuket">Phuket</label>
        </div>
      </div>

      <div class="row">
        <span>Available Stores</span>
        <div class="options">
          <label><input type="radio" name="status" value="Active">Active</label>
          <label><input type="radio" name="status" value="Inactive">Inactive</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Staff</legend>

      <div class="row">
        <label for="staffEmail">Staff Email</label>
        <input
          id="staffEmail"
          name="staffEmail"
          type="email"
          value=""
          required
        >
      </div>
    </fieldset>

    <button type="submit">Submit Form</button>
  </form>
</body>
</html>
